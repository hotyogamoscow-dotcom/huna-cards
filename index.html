<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Huna Cards App</title>
	<!-- Подключаем ваш внешний файл стилей -->
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="app">
    	<!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    	<div id="home-screen" class="screen">
        	<h1 class="main-title">🌺 Huna Symbol Cards</h1>
        	<div class="menu-buttons">
            	<button onclick="showDaily()">Карта Дня 🎲</button>
            	<button onclick="showLibrary()">Изучать Карты 📚</button>
            	<button onclick="showTheory()">Теория 📖</button>
            	<button onclick="showInterpretations()">Толкования Мэтта Джеймса 🎤</button>
        	</div>
    	</div>

    	<!-- ЭКРАН 2: ПРОСМОТР КАРТЫ (Универсальный экран) -->
    	<div id="card-screen" class="screen hidden">
        	<div class="nav-buttons">
            	<button class="back-btn" onclick="showHome()">← Назад</button>
            	<button id="next-card-btn" class="next-btn" onclick="handleNextCard()">Следующая →</button>
        	</div>
        	<div class="card">
            	<img id="card-image" src="" alt="Card Image">
            	<div class="card-info">
                	<h2 id="card-name"></h2>
                	<p id="card-translation"></p>
                	<div class="extra-info">
                    	<p><strong id="label-usage">Использование:</strong> <span id="card-usage"></span></p>
                    	<p><strong id="label-comment">Комментарий:</strong> <span id="card-comment"></span></p>
                	</div>
            	</div>
        	</div>
    	</div>

    	<!-- ЭКРАН 3: МАТРИЦА (БИБЛИОТЕКА) -->
    	<div id="library-screen" class="screen hidden">
        	<button class="back-btn" onclick="showHome()">← Назад</button>
        	<h1 class="screen-title">Библиотека</h1>
        	<div id="cards-grid" class="grid"></div>
    	</div>

    	<!-- ЭКРАН 4: ТЕОРИЯ -->
    	<div id="theory-screen" class="screen hidden">
        	<button class="back-btn" onclick="showHome()">← Назад</button>
        	<h1 class="screen-title">Теория</h1>
        	<div id="theory-grid" class="grid"></div>
    	</div>

    	<!-- ЭКРАН 5: ТОЛКОВАНИЯ МЭТТА -->
    	<div id="interpretations-screen" class="screen hidden">
        	<button class="back-btn" onclick="showHome()">← Назад</button>
        	<h1 class="screen-title">Толкования Мэтта</h1>
        	<div id="interpretations-grid" class="grid"></div>
    	</div>
	</div>

	<!-- Подключаем логику -->
	<script src="script.js"></script>
</body>
</html>
